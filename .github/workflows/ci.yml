name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@733ac7f8e3f9466f58fdec1db1c9426e5c402c4c
