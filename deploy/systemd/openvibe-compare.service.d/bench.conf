[Service]
# Plan §X step 2c (11-13): Compare carries Bench (server/bench-mount.js). /etc/openvibe is root-only, so systemd
# hands the service its own copy of Bench's env file. Rollback: delete this file (memory: bench-in-compare).
LoadCredential=bench.env:/etc/openvibe/bench.env
Environment=BENCH_ENV_FILE=%d/bench.env
# Compare reads Bench over loopback (#44): Bench answers through Compare's own fallback mount.
Environment=OV_BENCH_INTERNAL_URL=http://127.0.0.1:5280
