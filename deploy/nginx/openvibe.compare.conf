## ═══════════════════════════════════════════════════════════════
## openvibe.compare — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.compare.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5280, systemd unit openvibe-compare) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the forms, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for the public pages and entries; private,
## no-store for anything drawn for a signed-in person). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=compare_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=compare_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=compare_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.compare www.openvibe.compare;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.compare$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.compare;

    ssl_certificate     /etc/letsencrypt/live/openvibe.compare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.compare/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.compare$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.compare;

    ssl_certificate     /etc/letsencrypt/live/openvibe.compare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.compare/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.compare.access.log;
    error_log  /var/log/nginx/openvibe.compare.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=compare_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    location /auth/ {
        limit_req zone=compare_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    # ── Bench's API on Compare (plan §X step 1, 11-13: Compare takes Bench whole) ──
    # Compare answers its own /api/v1/compute and /api/v1/comparisons; every other /api/v1/ path is OpenVibe.Bench's
    # (kinds, benchmarks, ratings, boards, runs, models …), passed to it on loopback with the client's address kept.
    # A location that sets a header inherits none from the server block, so all five are repeated here.
    location ~ ^/api/v1/(compute|comparisons)(/|$) {
        limit_req zone=compare_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }
    location /api/v1/ {
        limit_req zone=compare_api burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host bench.openvibe.services;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5230;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=compare_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    # ── Forms and other writes: the vote, the caption generator, the report ──
    location ~ ^/(week/vote|make|m/[a-z0-9-]+/report)$ {
        limit_req zone=compare_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5280/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5280/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5280;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
